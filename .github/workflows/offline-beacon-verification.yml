name: Offline signed entropy-beacon verification
on:
  push:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/offline-beacon-verification.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/offline-beacon-verification.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
